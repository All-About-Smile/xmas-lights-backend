repos:
  # Black 포매터
  - repo: https://github.com/psf/black
    rev: 25.12.0   # 설치 시점 기준 최신 태그로 맞추면 좋음
    hooks:
      - id: black
        language_version: python3

  # Ruff 린터 + 자동 수정
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0    # 마찬가지로 적당히 최신 버전
    hooks:
      - id: ruff
        args: ["--fix"]   # 고칠 수 있는 건 자동으로 고쳐줘

  # # 선택: mypy 타입 체크도 커밋 전에 돌리고 싶으면 추가
  # mypy를 하면 느려져서 초반에는 빼고 코드 구조가 안정되면 추가
  # - repo: https://github.com/pre-commit/mirrors-mypy
